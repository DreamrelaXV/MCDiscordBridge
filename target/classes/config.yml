# MCDiscordBridge Configuration
# Author: dreamrela

# Discord Bot Configuration
discord:
  # Your Discord bot token
  token: "YOUR_BOT_TOKEN_HERE"
  
  # Activity status for the bot
  activity:
    type: "WATCHING" # PLAYING, STREAMING, LISTENING, WATCHING, COMPETING
    text: "Minecraft Server"
  
  # Root roles system - Define role aliases for easy management
  # You can use these aliases throughout the guild permissions instead of role IDs
  root_roles:
    owner: "OWNER_ROLE_ID_HERE"
    admin: "ADMIN_ROLE_ID_HERE"
    manager: "MANAGER_ROLE_ID_HERE"
    moderator: "MODERATOR_ROLE_ID_HERE"
    helper: "HELPER_ROLE_ID_HERE"
    staff: "STAFF_ROLE_ID_HERE"
    # Add as many roles as you want:
    # senior_mod: "SENIOR_MOD_ROLE_ID"
    # trial_mod: "TRIAL_MOD_ROLE_ID"
    # vip: "VIP_ROLE_ID"
  
  # Guild configurations (you can add multiple guilds)
  guilds:
    # First guild configuration
    guild1:
      id: "YOUR_FIRST_GUILD_ID"
      name: "Main Server"
      
      # Role permissions for each command
      # You can use either:
      # - Role aliases from root_roles (e.g., "owner", "admin")  
      # - Direct role IDs (e.g., "123456789012345678")
      # - Mix both approaches
      permissions:
        ban: ["owner", "admin", "moderator"]
        unban: ["owner", "admin", "moderator"]
        mute: ["owner", "admin", "moderator", "helper"]
        unmute: ["owner", "admin", "moderator", "helper"]
        kick: ["owner", "admin", "moderator"]
        list: ["owner", "admin", "moderator", "helper", "staff"]
        broadcast: ["owner", "admin"]
        reload: ["owner"]
        punishment-list: ["owner", "admin", "moderator", "helper"]
        rank-add: ["owner", "admin"]
        rank-remove: ["owner", "admin"]
        tags-add: ["owner", "admin", "moderator"]
        tags-remove: ["owner", "admin", "moderator"]
        help: [] # Empty means everyone can use it
    
    # Second guild configuration - can have different role mappings
    guild2:
      id: "YOUR_SECOND_GUILD_ID"
      name: "Secondary Server"
      
      # Override root roles for this specific guild if needed
      role_overrides:
        admin: "DIFFERENT_ADMIN_ROLE_ID_FOR_GUILD2"
        moderator: "DIFFERENT_MOD_ROLE_ID_FOR_GUILD2"
        # Any roles not overridden will use the root_roles values
      
      permissions:
        ban: ["owner", "admin"]  # More restrictive for this guild
        unban: ["owner", "admin"]
        mute: ["owner", "admin", "moderator"]
        unmute: ["owner", "admin", "moderator"]
        kick: ["owner", "admin", "moderator"]
        list: ["staff"]  # Only staff can view list
        broadcast: ["owner"]  # Only owner can broadcast
        reload: ["owner"]
        punishment-list: ["owner", "admin"]
        rank-add: ["owner"]
        rank-remove: ["owner"]
        tags-add: ["owner", "admin"]
        tags-remove: ["owner", "admin"]
        help: []

# Help command configuration
help:
  title: "MCDiscordBridge Commands"
  description: "Available commands for managing the Minecraft server"
  color: 0x00FF00 # Hex color code
  
  commands:
    - name: "/mc-ban"
      description: "Ban a player from the server using LiteBans"
      usage: "/mc-ban player:username duration:7d reason:Cheating"
    
    - name: "/mc-unban"
      description: "Unban a player from the server using LiteBans"
      usage: "/mc-unban player:username reason:Appeal accepted"
    
    - name: "/mc-mute"
      description: "Mute a player on the server"
      usage: "/mc-mute player:username duration:1h reason:Spamming"
    
    - name: "/rank add"
      description: "Add a LuckPerms rank to a player"
      usage: "/rank add player:username rank:group duration:permanent|7d|12h"
    
    - name: "/rank remove"
      description: "Remove a LuckPerms rank from a player"
      usage: "/rank remove player:username rank:group"
    
    - name: "/tags add"
      description: "Add a tag to a player (dispatched on server)"
      usage: "/tags add player:username tag:tagname"
    
    - name: "/tags remove"
      description: "Remove a tag from a player (dispatched on server)"
      usage: "/tags remove player:username tag:tagname"
    
    - name: "/mc-unmute"
      description: "Unmute a player on the server"
      usage: "/mc-unmute player:username reason:Time served"
    
    - name: "/mc-kick"
      description: "Kick a player from the server"
      usage: "/mc-kick player:username reason:Breaking rules"
    
    - name: "/list"
      description: "Show online players"
      usage: "/list"
    
    - name: "/brc"
      description: "Broadcast a message to the server"
      usage: "/brc text:Welcome to our server!"
    
    - name: "/punishment-list"
      description: "View player punishment history"
      usage: "/punishment-list player:username punishment:bans"
    
    - name: "/mc-dc-reload"
      description: "Reload the plugin configuration"
      usage: "/mc-dc-reload"
    
    - name: "/help"
      description: "Show this help message"
      usage: "/help"

# Plugin Integration Settings
plugins:
  # LiteBans configuration
  litebans:
    enabled: true
    # Command formats for LiteBans (removed -s flag for proper formatting)
    ban_command: "litebans:ban {player} {duration} {reason}"
    unban_command: "litebans:unban {player}"
    tempban_command: "litebans:tempban {player} {duration} {reason}"
    banip_command: "litebans:banip {player} {duration} {reason}"
    unbanip_command: "litebans:unbanip {player}"
    unbanall_command: "litebans:unbanall {player}"
    history_command: "litebans:history {player}"
    
  # Mute plugin configuration (EssentialsX, LiteBans, etc.)
  mute:
    enabled: true
    mute_command: "mute {player} {duration} {reason}"
    unmute_command: "unmute {player}"
  
  # LuckPerms command templates
  luckperms:
    add_parent_command: "lp user {player} parent add {rank}"
    addtemp_parent_command: "lp user {player} parent addtemp {rank} {duration}"
    remove_parent_command: "lp user {player} parent remove {rank}"

  # Tags plugin command templates
  tags:
    add_command: "tags add {player} {tag}"
    remove_command: "tags remove {player} {tag}"

# Embed colors (hex values)
colors:
  success: 0x00FF00
  error: 0xFF0000
  warning: 0xFFFF00
  info: 0x0099FF
  ban: 0xFF0000
  unban: 0x00FF00
  mute: 0xFFAA00
  unmute: 0x00FF00
  kick: 0xFF6600
  punishment: 0x9932CC

# Performance settings
performance:
  # Maximum time to wait for Minecraft operations (in milliseconds)
  timeout: 5000
  
  # Enable debug logging
  debug: false
  
  # Thread pool size for async operations
  thread_pool_size: 4

# Reload settings
reload:
  # Message to send before starting reload
  restart_message: "[RESTART] Plugin is reloading, please wait..."
  
  # Delay before actually restarting (in milliseconds)
  restart_delay: 2000

# Ban settings
ban:
  # Remove duration limits (set to 0 for unlimited)
  max_duration_days: 0  # 0 = no limit, previously was 365
  
  # Warning message for long bans (optional)
  long_ban_warning_days: 365  # Warn if ban is longer than 1 year

# Message templates
messages:
  # Success messages
  ban_success: "[SUCCESS] Successfully banned **{player}** for **{duration}** using LiteBans\n**Reason:** {reason}\n**IP Ban:** {ipban}"
  unban_success: "[SUCCESS] Successfully unbanned **{player}** using LiteBans\n**Reason:** {reason}"
  mute_success: "[SUCCESS] Successfully muted **{player}** for **{duration}**\n**Reason:** {reason}\n**IP Mute:** {ipmute}"
  unmute_success: "[SUCCESS] Successfully unmuted **{player}**\n**Reason:** {reason}"
  kick_success: "[SUCCESS] Successfully kicked **{player}**\n**Reason:** {reason}"
  broadcast_success: "[SUCCESS] Message broadcasted successfully!"
  reload_success: "[SUCCESS] Plugin reloaded successfully!"
  restart_pushed: "[RESTART] Restart pushed - Plugin is reloading..."
  punishment_list_success: "[INFO] Punishment history for **{player}**"
  
  # Error messages
  player_not_found: "[ERROR] Player **{player}** not found!"
  player_already_banned: "[ERROR] Player **{player}** is already banned!"
  player_not_banned: "[ERROR] Player **{player}** is not banned!"
  player_already_muted: "[ERROR] Player **{player}** is already muted!"
  player_not_muted: "[ERROR] Player **{player}** is not muted!"
  invalid_duration: "[ERROR] Invalid duration format! Use examples like: 1d, 2h, 30m, 45s"
  permission_denied: "[ERROR] You don't have permission to use this command!"
  command_error: "[ERROR] An error occurred while executing the command!"
  litebans_not_found: "[ERROR] LiteBans plugin not found! Please install LiteBans for ban/unban functionality."
  no_punishments_found: "[ERROR] No punishment history found for **{player}**"
  punishment_fetch_error: "[ERROR] Failed to fetch punishment history. Please try again later."
  role_not_found: "[WARNING] Role alias **{role}** not found in configuration!"
  
  # Info messages
  online_players: "**Online Players ({count}/{max}):**\n{players}"
  no_players_online: "**No players are currently online.**"